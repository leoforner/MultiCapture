name: Android CI/CD Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger no formato v1.0, v2.1.3, etc.
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Auto-Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Validação de Qualidade (Lint)
      - name: Run Android Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      # Testes Unitários Automáticos
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: true

      - name: Build Debug APK (Universal Architecture)
        run: ./gradlew assembleDebug

      # Upload do APK como artefato (disponível em qualquer push)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Extrai a versão da Tag para nomear o Release
      - name: Get tag or branch name
        id: extract_name
        run: echo "VERSION_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      # Cria a Release Automática com o APK gerado (somente em tags)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Lançamento Oficial ${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
