name: Android CI/CD Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger no formato v1.0, v2.1.3, etc.
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

jobs:
  build_and_release:
    name: Build & Auto-Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # Melhoria 1: Caching nativo do Gradle para acelerar builds futuros

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Melhoria 2: Validação de Qualidade (Lint)
      - name: Run Android Lint
        run: ./gradlew lintDebug
        continue-on-error: true # Continua mesmo com warnings, apenas para report no início

      # Melhoria 3: Testes Unitários Automáticos
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK (Universal Architecture)
        run: ./gradlew assembleDebug

      # Extrai a versão da Tag para nomear o Release (Ex: v1.0.0)
      - name: Get tag or branch name
        id: extract_name
        run: echo "VERSION_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      # Melhoria 4: Cria a Release Automática com o APK gerado
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Só publica release oficial se for uma Tag
        with:
          name: Lançamento Oficial ${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true # Gera o changelog sozinho!
          files: app/build/outputs/apk/debug/app-debug.apk
